version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kbo-ai-brief-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: kboroot1234
      MYSQL_DATABASE: kbo_ai_brief
      MYSQL_USER: kbouser
      MYSQL_PASSWORD: kbopass1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pkboroot1234"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
